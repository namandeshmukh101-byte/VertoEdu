# ============================================================
# VertoEdu Backend — Application Configuration
# ============================================================

# Application
spring.application.name=VertoEdu

# Server
server.port=8080
server.servlet.context-path=/api

# ============================================================
# Database (MySQL)
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vertoedu?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================
# Google OAuth2
# ============================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ============================================================
# Multipart File Limits
# ============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==================================================================
# JWT
# ============================================================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
jwt.cookie-max-age-seconds=86400

# ============================================================
# Admin Emails (comma-separated Google emails that get ADMIN role)
# ============================================================
app.admin-emails=${ADMIN_EMAILS:}

# ============================================================
# Frontend URL (for OAuth redirects)
# ============================================================
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ============================================================
# CORS
# ============================================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ============================================================
# OpenAI API (to be configured in later prompts)
# ============================================================
# openai.api.key=${OPENAI_API_KEY:}

# ============================================================
# OCR API (to be configured in later prompts)
# ============================================================
# ocr.api.key=${OCR_API_KEY:}

# External Services
ocr.service.url=${OCR_SERVICE_URL}
openai.api.key=${OPENAI_API_KEY:}

